<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Inverter Monitor</title>
    {% include '_head.html' %}
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 15a8 8 0 0 1 16 0"/>
                        <path d="M12 3v2M4.9 6.9l1.4 1.4M19.1 6.9l-1.4 1.4M2 15h2M20 15h2"/>
                        <path d="M13 12l-3 5h4l-3 5"/>
                    </svg>
                </span>
                <div>
                    <div class="login-title">Inverter Monitor</div>
                    <div class="login-sub">Sign in to see your system</div>
                </div>
            </div>

            {% if error %}
            <div class="alert alert-danger" style="margin-bottom:14px">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('auth.login') }}" autocomplete="off" id="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="login-user">Username</label>
                    <input id="login-user" class="input" type="text" name="username" required autofocus autocomplete="username">
                </div>
                <div class="field">
                    <label for="login-pass">Password</label>
                    <input id="login-pass" class="input" type="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>
            <div class="login-foot">build {{ app_version }}</div>
        </div>
    </div>
    <script>
    // Keep ?next=… (and the error flag) on the POST so a successful sign-in returns to the
    // page that was requested instead of always landing on the dashboard.
    (function () {
        var f = document.getElementById('login-form');
        if (f && window.location.search) f.action = f.getAttribute('action').split('?')[0] + window.location.search;
    })();
    </script>
</body>
</html>
